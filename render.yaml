databases:
  - name: loadlyx-postgres
    databaseName: loadlyx
    user: loadlyx_user
    plan: starter

services:
  - type: web
    name: loadlyx-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loadlyx-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: worker
    name: loadlyx-worker
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loadlyx-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
